<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<title>NASA Ledger</title>
<style>
  :root{
    --bg:#F5F6F2;
    --surface:#FFFFFF;
    --surface-2:#EBEEE7;
    --surface-3:#E0E4DB;
    --border:#D7DBD0;
    --ink:#16211C;
    --ink-dim:#57645C;
    --ink-faint:#8A968D;
    --accent:#0E5C56;
    --accent-strong:#093F3B;
    --accent-soft:#DCEBE8;
    --accent-ink:#083330;
    --good:#2C7A54;
    --good-soft:#E1F1E7;
    --warn:#9C6B12;
    --warn-soft:#FBF0D8;
    --danger:#AE3838;
    --danger-soft:#FAE4E2;
    --shadow: 0 1px 2px rgba(20,30,25,0.04), 0 4px 14px rgba(20,30,25,0.06);
    --font-display:'Fraunces', Georgia, 'Iowan Old Style', serif;
    --font-body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101715;
      --surface:#17211D;
      --surface-2:#1E2A25;
      --surface-3:#26332C;
      --border:#2C3B33;
      --ink:#E9EFE9;
      --ink-dim:#A7B5AC;
      --ink-faint:#748077;
      --accent:#59C4B6;
      --accent-strong:#8AD9CD;
      --accent-soft:#183732;
      --accent-ink:#B7EAE1;
      --good:#6BC48F;
      --good-soft:#173428;
      --warn:#E3B45C;
      --warn-soft:#3B2E12;
      --danger:#E58787;
      --danger-soft:#3B1D1B;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101715;
    --surface:#17211D;
    --surface-2:#1E2A25;
    --surface-3:#26332C;
    --border:#2C3B33;
    --ink:#E9EFE9;
    --ink-dim:#A7B5AC;
    --ink-faint:#748077;
    --accent:#59C4B6;
    --accent-strong:#8AD9CD;
    --accent-soft:#183732;
    --accent-ink:#B7EAE1;
    --good:#6BC48F;
    --good-soft:#173428;
    --warn:#E3B45C;
    --warn-soft:#3B2E12;
    --danger:#E58787;
    --danger-soft:#3B1D1B;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); color:var(--accent-ink); }
  a{ color:var(--accent); }
  button, input, select{ font-family:inherit; font-size:inherit; color:inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; }
  .num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

  #app{
    display:grid;
    grid-template-columns:236px 1fr;
    min-height:100vh;
  }

  .sidebar{
    position:sticky; top:0; height:100vh;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    padding:22px 16px;
    gap:22px;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; padding:0 8px; }
  .brand .mark{ font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:0.01em; }
  .brand .sub{ font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em; }

  .sidebar nav{ display:flex; flex-direction:column; gap:2px; }
  .navlabel{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.09em; color:var(--ink-faint); padding:14px 10px 6px; }
  .navitem{
    display:flex; align-items:center; gap:10px;
    padding:8px 10px; border-radius:8px;
    color:var(--ink-dim); text-decoration:none;
    font-size:13.5px; font-weight:500;
    cursor:pointer; border:1px solid transparent; background:none; text-align:left; width:100%;
  }
  .navitem .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; opacity:0.55; flex:none; }
  .navitem:hover{ background:var(--surface-2); color:var(--ink); }
  .navitem.active{ background:var(--accent-soft); color:var(--accent-ink); font-weight:600; }
  .navitem.active .dot{ opacity:1; }
  .sidebar-foot{ margin-top:auto; padding:10px 8px 0; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink-faint); line-height:1.5; }

  main{ min-width:0; padding:26px 32px 60px; max-width:1320px; margin:0 auto; width:100%; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    margin-bottom:26px; flex-wrap:wrap;
  }
  .topbar h1{ font-size:26px; }
  .topbar .meta{ font-size:12px; color:var(--ink-faint); margin-top:4px; }
  .topbar-actions{ display:flex; gap:10px; align-items:center; }

  .search{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:9px;
    padding:7px 12px; min-width:220px;
  }
  .search input{ border:none; background:none; width:100%; color:var(--ink); }
  .search input:focus{ outline:none; }
  .search svg{ flex:none; opacity:0.5; }

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:9px 15px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-weight:600; font-size:13px;
    cursor:pointer; white-space:nowrap;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn.ghost{ background:none; border-color:transparent; }
  .btn.ghost:hover{ background:var(--surface-2); }
  .btn.danger{ color:var(--danger); }
  .btn.small{ padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .grid-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:22px; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px; box-shadow:var(--shadow);
  }
  .card .card-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-faint); font-weight:600; }
  .card .card-value{ font-family:var(--font-mono); font-size:26px; font-weight:600; margin-top:8px; font-variant-numeric:tabular-nums; }
  .card .card-sub{ font-size:12px; color:var(--ink-dim); margin-top:6px; }
  .card.accent-Michy{ border-top:3px solid #3E7CB1; }
  .card.accent-Deia{ border-top:3px solid #B1723E; }
  .card.accent-Ayman{ border-top:3px solid #7A5CB8; }

  .section{ margin-bottom:30px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; gap:12px; flex-wrap:wrap; }
  .section-head h2{ font-size:17px; }
  .section-head .hint{ font-size:12px; color:var(--ink-faint); }

  .pill{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600;
    background:var(--surface-2); color:var(--ink-dim);
  }
  .pill.good{ background:var(--good-soft); color:var(--good); }
  .pill.warn{ background:var(--warn-soft); color:var(--warn); }
  .pill.danger{ background:var(--danger-soft); color:var(--danger); }
  .pill.accent{ background:var(--accent-soft); color:var(--accent-ink); }

  .table-wrap{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    overflow:auto; box-shadow:var(--shadow);
  }
  table{ width:100%; border-collapse:collapse; min-width:640px; }
  thead th{
    position:sticky; top:0; background:var(--surface-2); z-index:1;
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--ink-faint); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  tbody td{ padding:10px 14px; border-bottom:1px solid var(--border); vertical-align:middle; font-size:13px; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface-2); }
  td.num, th.num{ text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  td.muted{ color:var(--ink-faint); }
  .row-neg{ color:var(--danger); }

  .credit-input{
    width:96px; padding:5px 8px; border-radius:7px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-family:var(--font-mono); text-align:right;
  }
  .credit-input:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }

  .pagination{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-top:1px solid var(--border); font-size:12px; color:var(--ink-faint); }
  .pagination .pbtns{ display:flex; gap:6px; }

  .empty{ padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:13px; }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(10,15,12,0.45);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    width:100%; max-width:420px; padding:22px; box-shadow:var(--shadow);
  }
  .modal h3{ font-size:17px; margin-bottom:4px; }
  .modal .modal-sub{ font-size:12.5px; color:var(--ink-faint); margin-bottom:16px; }
  .field{ margin-bottom:14px; display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink-dim); }
  .field input, .field select, .field textarea{
    padding:9px 11px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  .seg{ display:flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; }
  .seg button{ flex:1; padding:8px 10px; border:none; background:var(--surface); color:var(--ink-dim); font-weight:600; font-size:12.5px; cursor:pointer; }
  .seg button.active{ background:var(--accent); color:#fff; }
  .field-error{ font-size:11.5px; color:var(--danger); }

  .toastwrap{ position:fixed; bottom:20px; right:20px; z-index:100; display:flex; flex-direction:column; gap:8px; }
  .toast{
    background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:9px; font-size:13px;
    box-shadow:var(--shadow); max-width:320px;
  }
  :root:not([data-theme="light"]) .toast{ background:var(--surface-3); color:var(--ink); border:1px solid var(--border); }
  :root[data-theme="dark"] .toast{ background:var(--surface-3); color:var(--ink); border:1px solid var(--border); }
  .toast.err{ background:var(--danger); color:#fff; }

  .bars{ display:flex; flex-direction:column; gap:10px; }
  .bar-row{ display:grid; grid-template-columns:70px 1fr auto; align-items:center; gap:12px; font-size:12.5px; }
  .bar-track{ height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:99px; }

  .kv{ display:flex; flex-direction:column; gap:8px; }
  .kv-row{ display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:6px 0; border-bottom:1px dashed var(--border); }
  .kv-row:last-child{ border-bottom:none; }
  .kv-row .k{ color:var(--ink-dim); }
  .kv-row .v{ font-family:var(--font-mono); font-weight:600; }

  .badgebar{ display:flex; gap:6px; flex-wrap:wrap; }

  .view{ display:none; }
  .view.active{ display:block; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

  @media (max-width:860px){
    #app{ grid-template-columns:1fr; }
    .sidebar{ position:static; height:auto; flex-direction:row; overflow-x:auto; padding:10px 12px; gap:4px; }
    .sidebar .brand{ display:none; }
    .sidebar nav{ flex-direction:row; }
    .sidebar .navlabel{ display:none; }
    .sidebar-foot{ display:none; }
    main{ padding:18px 16px 40px; }
    .topbar{ flex-direction:column; align-items:stretch; }
    .topbar-actions{ flex-direction:column; align-items:stretch; }
    .search{ min-width:0; }
  }
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">NASA Ledger</div>
      <div class="sub">Octopus · shipment finance</div>
    </div>
    <nav id="mainnav">
      <div class="navlabel">General</div>
      <button class="navitem" data-view="overview"><span class="dot"></span>Overview</button>
      <div class="navlabel">Nasa Accounts</div>
      <button class="navitem" data-view="account-Michy"><span class="dot"></span>Michy</button>
      <button class="navitem" data-view="account-Deia"><span class="dot"></span>Deia</button>
      <button class="navitem" data-view="account-Ayman"><span class="dot"></span>Ayman</button>
      <div class="navlabel">Not Finish File</div>
      <button class="navitem" data-view="notfinished-Michy"><span class="dot"></span>Michy</button>
      <button class="navitem" data-view="notfinished-Deia"><span class="dot"></span>Deia</button>
      <button class="navitem" data-view="notfinished-Ayman"><span class="dot"></span>Ayman</button>
      <div class="navlabel">External Account</div>
      <button class="navitem" data-view="extworker-Michy"><span class="dot"></span>Michy</button>
      <button class="navitem" data-view="extworker-Deia"><span class="dot"></span>Deia</button>
      <button class="navitem" data-view="extworker-Ayman"><span class="dot"></span>Ayman</button>
      <div class="navlabel">Money</div>
      <button class="navitem" data-view="customers"><span class="dot"></span>Customers</button>
      <button class="navitem" data-view="paymentlog"><span class="dot"></span>Payment Log</button>
    </nav>
    <div class="sidebar-foot" id="sidebarfoot">Shipment data synced from Drive.</div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h1 id="pagetitle">Overview</h1>
        <div class="meta" id="pagemeta"></div>
      </div>
      <div class="topbar-actions">
        <label class="search" aria-label="Search shipments or customers">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input type="text" id="globalsearch" placeholder="Search customer, container, file #…">
        </label>
        <button class="btn primary" id="btn-log-payment">+ Log Payment</button>
      </div>
    </div>

    <section class="view" id="view-overview"></section>
    <section class="view" id="view-account-Michy"></section>
    <section class="view" id="view-account-Deia"></section>
    <section class="view" id="view-account-Ayman"></section>
    <section class="view" id="view-notfinished-Michy"></section>
    <section class="view" id="view-notfinished-Deia"></section>
    <section class="view" id="view-notfinished-Ayman"></section>
    <section class="view" id="view-extworker-Michy"></section>
    <section class="view" id="view-extworker-Deia"></section>
    <section class="view" id="view-extworker-Ayman"></section>
    <section class="view" id="view-customers"></section>
    <section class="view" id="view-paymentlog"></section>
    <section class="view" id="view-search"></section>
  </main>
</div>

    var neg = n < 0;
    var s = Math.round(Math.abs(n)).toLocaleString('en-US');
    return (neg?'−':'') + s;
  }
  function fmtDate(iso){
    if(!iso) return '—';
    var d = new Date(iso+'T00:00:00');
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function uid(){ return 'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function toast(msg, isErr){
    var wrap = document.getElementById('toastwrap');
    var el = document.createElement('div');
    el.className = 'toast'+(isErr?' err':'');
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(function(){ el.remove(); },320); }, 3200);
  }

  // ---------- computed aggregates ----------
  function accountTotals(account){
    var sold=0, paid=0, grossProfit=0, addCost=0, count=0;
    for(var i=0;i<shipments.length;i++){
      var s = shipments[i];
      if(s.account!==account) continue;
      sold += s.sold; paid += s.paid; grossProfit += s.profit; addCost += s.additionalCost; count++;
    }
    var nasaPaid = 0;
    state.nasaPayments.forEach(function(p){ if(p.account===account) nasaPaid += Number(p.amount)||0; });
    var extPaid = 0;
    (state.externalWorkerPayments||[]).forEach(function(p){ if(p.account===account) extPaid += Number(p.amount)||0; });
    var adj = Number(state.accountAdjustments[account]) || 0;
    var totalCost = paid + addCost; // what's actually owed to NASA per shipment: Paid + Additional Cost
    var profit = grossProfit - extPaid; // net of unexpected amounts paid to external workers
    return { sold:sold, paid:paid, profit:profit, grossProfit:grossProfit, extPaid:extPaid, addCost:addCost, totalCost:totalCost, count:count, nasaPaid:nasaPaid, adjustment:adj, debt: totalCost - nasaPaid + adj };
  }

  // Looks up which shipment (finished or not-yet-invoiced) a typed file number or
  // container number belongs to, so an External Worker entry can be tied back to a
  // real file without the user re-typing the customer/goods themselves.
  function findShipmentMatch(ref){
    ref = (ref||'').trim().toLowerCase();
    if(!ref) return null;
    var pools = [shipments, notFinished];
    for(var p=0;p<pools.length;p++){
      var list = pools[p];
      for(var i=0;i<list.length;i++){
        var s = list[i];
        if(s.fileNumber && String(s.fileNumber).trim().toLowerCase()===ref) return s;
        var containers = String(s.containerNumber||'').split(',').map(function(c){ return c.trim().toLowerCase(); });
        if(containers.indexOf(ref)>-1) return s;
      }
    }
    return null;
  }

  function customerAggregates(){
    var map = {};
    shipments.forEach(function(s){
      var key = s.customer && s.customer.trim();
      if(!key) return;
      if(!map[key]) map[key] = { customer:key, sold:0, count:0, accounts:{} };
      map[key].sold += s.sold;
      map[key].count += 1;
      map[key].accounts[s.account] = true;
    });
    state.customerPayments.forEach(function(p){
      var key = p.customer && p.customer.trim();
      if(!key) return;
      if(!map[key]) map[key] = { customer:key, sold:0, count:0, accounts:{} };
      map[key].paid = (map[key].paid||0) + (Number(p.amount)||0);
    });
    var list = Object.keys(map).map(function(k){
      var m = map[k];
      m.paid = m.paid || 0;
      m.adjustment = Number(state.customerAdjustments[k]) || 0;
      m.balance = m.sold - m.paid + m.adjustment;
      m.limit = state.creditLimits[k] != null ? Number(state.creditLimits[k]) : null;
      m.accountList = Object.keys(m.accounts);
      return m;
    });
    return list;
  }

  function customerStatus(m){
    if(m.limit==null || m.limit===0){
      return {label:'No limit set', cls:'', };
    }
    if(m.balance > m.limit) return {label:'Over limit', cls:'danger'};
    if(m.balance > m.limit*0.8) return {label:'Near limit', cls:'warn'};
    return {label:'Within limit', cls:'good'};
  }

  // ---------- persistence ----------
  function persist(successMsg){
    document.getElementById('state-data').textContent = JSON.stringify(state);
    var newHtml = PRISTINE_HTML.replace(
      /<script id="state-data"[^>]*>[\s\S]*?<\/script>/,
      function(){ return '<script id="state-data" type="application/json">'+JSON.stringify(state).replace(/<\/script>/g,'<\\/script>')+'<\/script>'; }
    );
    var fullDoc = '<!doctype html>\n' + newHtml;

    // Always save to the shared Supabase row first — this is what makes the
    // ledger editable from octopus-track.com as well as from here.
    var cloudSave = sbSaveLedger(state);

    if(!window.claude || !window.claude.use){
      return cloudSave.then(function(ok){
        if(ok){ if(successMsg) toast(successMsg); }
        else { toast('Could not save. Please check your connection and try again.', true); }
      });
    }
    return window.claude.use('artifact').then(function(artifact){
      if(!artifact){
        return cloudSave.then(function(ok){
          if(ok){ if(successMsg) toast(successMsg); }
          else { toast('Could not save. Please check your connection and try again.', true); }
        });
      }
      return cloudSave.then(function(cloudOk){
        return artifact.publish(fullDoc).then(function(){
          if(successMsg) toast(cloudOk ? successMsg : successMsg + ' (cloud sync failed — will retry next save)');
        });
      }).catch(function(err){
        var code = err && err.code;
        if(code==='not_granted' || code==='not_writer'){
          toast("You have view-only access, so this change wasn't saved.", true);
        } else if(code==='conflict'){
          toast('Someone else just updated this — reloading latest data.', true);
          setTimeout(function(){ location.reload(); }, 1200);
        } else {
          toast('Could not save. Please try again.', true);
        }
      });
    });
  }

    totals.forEach(function(x){ grandSold+=x.t.sold; grandPaid+=x.t.paid; grandAddCost+=x.t.addCost; grandTotalCost+=x.t.totalCost; grandProfit+=x.t.profit; grandDebt+=x.t.debt; });

  // ---------- render: external worker account (unexpected amounts) ----------
  function renderExternalWorker(account){
    var root = document.getElementById('view-extworker-'+account);
    var full = (state.externalWorkerPayments||[]).filter(function(p){ return p.account===account; });

    // Reason dropdown always lists every reason ever logged for this account,
    // regardless of the period/reason filters currently applied — otherwise
    // picking a reason would make the other reasons disappear from the list.
    var reasonSet = {};
    full.forEach(function(p){ if(p.reason) reasonSet[p.reason.trim()] = true; });
    var reasons = Object.keys(reasonSet).sort(function(a,b){ return a.localeCompare(b); });

    var now = new Date();
    var dow = now.getDay();
    var mondayOffset = dow===0 ? 6 : dow-1;
    var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate()-mondayOffset);
    function pad2(n){ return n<10 ? '0'+n : ''+n; }
    var weekStartStr = monday.getFullYear()+'-'+pad2(monday.getMonth()+1)+'-'+pad2(monday.getDate());
    var monthStartStr = now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-01';
    var yearStartStr = now.getFullYear()+'-01-01';
    var periodStart = extwPeriodFilter==='week' ? weekStartStr : extwPeriodFilter==='month' ? monthStartStr : extwPeriodFilter==='year' ? yearStartStr : null;

    var list = full.filter(function(p){
      if(periodStart && !(p.date >= periodStart)) return false;
      if(extwReasonFilter!=='all' && (p.reason||'').trim()!==extwReasonFilter) return false;
      return true;
    });
    if(searchTerm){
      list = list.filter(function(p){
        return ((p.reason||'')+' '+(p.ref||'')+' '+(p.payee||'')).toLowerCase().indexOf(searchTerm)>-1;
      });
    }
    list = list.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });

    var total = list.reduce(function(a,p){ return a+(Number(p.amount)||0); }, 0);

    var periodLabels = { all:'All time', week:'This week', month:'This month', year:'This year' };
    var periodBtns = ['all','week','month','year'].map(function(k){
      return '<button type="button" data-extw-period="'+k+'" class="'+(extwPeriodFilter===k?'active':'')+'">'+periodLabels[k]+'</button>';
    }).join('');
    var reasonOptions = '<option value="all">All reasons</option>'+reasons.map(function(r){
      return '<option value="'+esc(r)+'" '+(extwReasonFilter===r?'selected':'')+'>'+esc(r)+'</option>';
    }).join('');

    var rows = list.length ? list.map(function(p){
      var match = findShipmentMatch(p.ref);
      var matchHtml = match
        ? '<span class="pill good">'+esc(match.customer||'—')+'</span> <span class="muted">'+esc(match.goods||'')+'</span>'+
          '<div class="muted" style="font-size:11.5px; margin-top:2px;">File '+esc(match.fileNumber||'—')+' · '+esc(match.containerNumber||'—')+'</div>'
        : (p.ref ? '<span class="pill warn">No match found</span>' : '<span class="muted">—</span>');
      return '<tr><td>'+fmtDate(p.date)+'</td><td class="num row-neg">'+fmt(p.amount)+'</td><td>'+esc(p.payee||'—')+'</td><td>'+esc(p.reason||'—')+'</td>'+
        '<td class="muted">'+esc(p.ref||'—')+'</td><td>'+matchHtml+'</td>'+
        '<td><button class="btn small ghost danger" data-del-extw="'+p.id+'">Remove</button></td></tr>';
    }).join('') : '<tr><td colspan="7" class="empty">No external worker payments match'+(extwPeriodFilter!=='all'||extwReasonFilter!=='all'?' these filters':' yet for '+account)+'.</td></tr>';

    root.innerHTML =
      '<div class="grid-cards">'+
        '<div class="card accent-'+account+'"><div class="card-label">Total paid to external workers</div><div class="card-value row-neg">'+fmt(total)+'</div><div class="card-sub">'+list.length+' of '+full.length+' entries · subtracted from '+account+' profit</div></div>'+
      '</div>'+
      '<div class="section"><div class="section-head"><h2>External Account — '+account+'</h2><button class="btn small primary" data-open-extw-pay="'+account+'">+ Log External Worker Payment</button></div>'+
        '<div class="table-wrap" style="padding:14px 16px; margin-bottom:14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">'+
          '<div class="seg" style="max-width:380px;" id="extw-period-seg">'+periodBtns+'</div>'+
          '<select id="extw-reason-filter" style="padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); max-width:200px;">'+reasonOptions+'</select>'+
        '</div>'+
        '<div class="table-wrap"><table><thead><tr><th>Date</th><th class="num">Amount</th><th>Paid to</th><th>Reason</th><th>File / Container #</th><th>Matched shipment</th><th></th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table></div></div>';
  }

  function pagination(key, page, totalPages, total){
    if(total===0) return '';
    return '<div class="pagination"><div>Page '+(page+1)+' of '+totalPages+' · '+total+' rows</div><div class="pbtns">'+
      '<button class="btn small" data-page="'+key+':'+(page-1)+'" '+(page<=0?'disabled':'')+'>Prev</button>'+
      '<button class="btn small" data-page="'+key+':'+(page+1)+'" '+(page>=totalPages-1?'disabled':'')+'>Next</button>'+
      '</div></div>';
  }

  // ---------- render: payment log ----------
  // Two concentric progress rings as inline SVG: outer = % of "sold" paid so far,
  // inner = % of credit limit used. No external chart library needed.
  function donutRingArc(cx, cy, r, strokeWidth, pct, color, trackColor){
    var circ = 2*Math.PI*r;
    pct = Math.max(0, Math.min(100, pct));
    var arc = circ * pct/100;
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+trackColor+'" stroke-width="'+strokeWidth+'"/>'+
      (arc>0 ? '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+strokeWidth+'" stroke-linecap="round" stroke-dasharray="'+arc+' '+(circ-arc)+'" transform="rotate(-90 '+cx+' '+cy+')"/>' : '');
  }

  function customerSnapshotHTML(m){
    var st = customerStatus(m);
    var paidPct = m.sold>0 ? Math.round((m.paid/m.sold)*100) : (m.paid>0 ? 100 : 0);
    var hasLimit = m.limit!=null && m.limit>0;
    var usagePct = hasLimit ? Math.round((m.balance/m.limit)*100) : 0;
    var usageColor = usagePct>100 ? 'var(--danger)' : (usagePct>80 ? 'var(--warn)' : 'var(--good)');

    // Files not invoiced yet (2026, "Send Invoices" still "No") for this same customer —
    // future money expected from them once those go through, not part of the debt/balance yet.
    var pending = notFinished.filter(function(s){ return s.customer===m.customer; })
      .sort(function(a,b){ return (a.arrivalDate||'').localeCompare(b.arrivalDate||''); });
    var pendingSold = pending.reduce(function(a,s){ return a+s.sold; },0);
    var pendingRows = pending.map(function(s){
      return '<tr>'+
        '<td class="muted">'+esc(s.goods)+'</td>'+
        '<td class="muted">'+esc(s.containerNumber)+'</td>'+
        '<td>'+fmtDate(s.arrivalDate)+'</td>'+
        '<td class="num">'+fmt(s.sold)+'</td>'+
        '<td class="muted">'+esc(s.fileNumber)+'</td>'+
      '</tr>';
    }).join('');
    var pendingHtml = pending.length ?
      '<div style="margin-top:18px; padding-top:16px; border-top:1px solid var(--border);">'+
        '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">'+
          '<div style="font-size:13px; font-weight:600; color:var(--ink);">Upcoming files — not invoiced yet</div>'+
          '<div style="font-size:12px; color:var(--ink-faint);">'+pending.length+' file'+(pending.length===1?'':'s')+' · expected '+fmt(pendingSold)+'</div>'+
        '</div>'+
        '<div style="border:1px solid var(--border); border-radius:10px; overflow:auto;">'+
          '<table style="min-width:0;"><thead><tr><th>Goods</th><th>Container</th><th>Arrival</th><th class="num">Sold</th><th>File #</th></tr></thead>'+
          '<tbody>'+pendingRows+'</tbody></table>'+
        '</div>'+
      '</div>' : '';

    var svg = '<svg viewBox="0 0 120 120" width="136" height="136" style="flex:none">'+
      donutRingArc(60,60,50,13, paidPct, 'var(--accent)', 'var(--surface-3)') +
      (hasLimit ? donutRingArc(60,60,32,13, usagePct, usageColor, 'var(--surface-3)') : '<circle cx="60" cy="60" r="32" fill="none" stroke="var(--surface-3)" stroke-width="13"/>') +
      '<text x="60" y="55" text-anchor="middle" style="font-family:var(--font-mono);font-size:21px;font-weight:600;fill:var(--ink)">'+paidPct+'%</text>'+
      '<text x="60" y="71" text-anchor="middle" style="font-family:var(--font-body);font-size:9px;letter-spacing:.04em;fill:var(--ink-faint)">PAID OF FILE</text>'+
    '</svg>';

    var badges = m.accountList.map(function(a){ return '<span class="pill" style="background:'+ACCOUNT_COLOR[a]+'22;color:'+ACCOUNT_COLOR[a]+'">'+a+'</span>'; }).join(' ') || '<span class="muted">No linked shipments</span>';

    return '<div class="section"><div class="section-head"><h2>Customer snapshot — '+esc(m.customer)+'</h2><div class="badgebar">'+badges+'</div></div>'+
      '<div class="table-wrap" style="padding:22px;">'+
        '<div style="display:flex; gap:30px; align-items:center; flex-wrap:wrap;">'+
          '<div style="display:flex; flex-direction:column; align-items:center; gap:8px;">'+svg+
            '<div style="display:flex; gap:14px; font-size:11px; color:var(--ink-faint);">'+
              '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:4px;"></span>Paid</span>'+
              '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+(hasLimit?usageColor:'var(--surface-3)')+';margin-right:4px;"></span>Credit used</span>'+
            '</div>'+
          '</div>'+
          '<div class="kv" style="flex:1; min-width:240px;">'+
            '<div class="kv-row"><div class="k">Total file (sold)</div><div class="v">'+fmt(m.sold)+'</div></div>'+
            '<div class="kv-row"><div class="k">Paid so far</div><div class="v">'+fmt(m.paid)+' ('+paidPct+'%)</div></div>'+
            '<div class="kv-row"><div class="k">Balance owed</div><div class="v'+(m.balance>0?' row-neg':'')+'">'+fmt(m.balance)+'</div></div>'+
            '<div class="kv-row"><div class="k">Credit limit</div><div class="v">'+(hasLimit?fmt(m.limit):'No limit set')+'</div></div>'+

            (pending.length ? '<div class="kv-row"><div class="k">Upcoming (not invoiced)</div><div class="v" style="color:var(--warn)">'+fmt(pendingSold)+'</div></div>' : '')+
          '</div>'+
        '</div>'+
        pendingHtml+
      '</div>'+
    '</div>';
  }

  function renderPaymentLog(){
    var root = document.getElementById('view-paymentlog');

    // Customer payments aren't tagged with an agent/account directly — derive it from
    // which NASA account(s) that customer actually has shipments under.
    var aggregates = customerAggregates();
    var custAccounts = {};
    var custByName = {};
    aggregates.forEach(function(m){ custAccounts[m.customer] = m.accountList; custByName[m.customer] = m; });

    var all = state.customerPayments.map(function(p){ return Object.assign({type:'customer'}, p); })
      .concat(state.nasaPayments.map(function(p){ return Object.assign({type:'nasa'}, p); }));
    if(searchTerm){
      // Payment Log search only ever searches payments — it never pulls in shipments,
      // so looking up a customer number here shows just their payment history.
      all = all.filter(function(p){
        var accts = p.type==='customer' ? (custAccounts[p.customer]||[]).join(' ') : (p.account||'');
        return ((p.customer||'')+' '+accts+' '+(p.note||'')).toLowerCase().indexOf(searchTerm)>-1;
      });
    }
    all.sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.id||'').localeCompare(a.id||''); });

    // If the search narrows the results down to a handful of customers, surface a visual
    // snapshot of each one's whole file (paid %, balance, credit-limit usage) above the list.
    // A loose match like "mohi" (which hits both "Mohi" and "Mohi Private") still shows a
    // card per customer; a broad match like an agent name (dozens of different customers)
    // does not — that many cards would just be noise.
    var snapshotHtml = '';
    if(searchTerm){
      var namesInResults = {};
      all.forEach(function(p){ if(p.type==='customer' && p.customer) namesInResults[p.customer]=true; });
      var names = Object.keys(namesInResults);
      if(names.length>=1 && names.length<=5){
        snapshotHtml = names.filter(function(n){ return custByName[n]; })
          .map(function(n){ return customerSnapshotHTML(custByName[n]); }).join('');
      }
    }

    // Weekly (Mon-start) / monthly (calendar) totals per account, split by
    // direction: money we SEND to NASA vs money we RECEIVE from customers.
    // Uses the viewer's local clock.
    var now = new Date();
    var dow = now.getDay(); // 0=Sun..6=Sat
    var mondayOffset = dow===0 ? 6 : dow-1;
    var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate()-mondayOffset);
    function pad2(n){ return n<10 ? '0'+n : ''+n; }
    var weekStartStr = monday.getFullYear()+'-'+pad2(monday.getMonth()+1)+'-'+pad2(monday.getDate());
    var monthStartStr = now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-01';
    var nasaTotals = {}, custTotals = {};
    ACCOUNTS.forEach(function(a){ nasaTotals[a] = {week:0, month:0}; custTotals[a] = {week:0, month:0}; });
    all.forEach(function(p){
      var amt = Number(p.amount)||0;
      if(!amt) return;
      var accts = p.type==='customer' ? (custAccounts[p.customer]||[]) : (p.account ? [p.account] : []);
      var bucket = p.type==='customer' ? custTotals : nasaTotals;
      accts.forEach(function(a){
        if(!bucket[a]) return;
        if(p.date >= weekStartStr) bucket[a].week += amt;
        if(p.date >= monthStartStr) bucket[a].month += amt;
      });
    });
    function periodTable(title, hint, totals){
      return '<div class="section"><div class="section-head"><h2>'+title+'</h2>'+
        '<span class="hint">'+hint+'</span></div>'+
        '<div class="table-wrap"><table><thead><tr><th>Account</th><th class="num">This week</th><th class="num">This month</th></tr></thead><tbody>'+
        ACCOUNTS.map(function(a){
          var t = totals[a];
          return '<tr><td><span class="pill" style="background:'+ACCOUNT_COLOR[a]+'22;color:'+ACCOUNT_COLOR[a]+'">'+a+'</span></td>'+
            '<td class="num">'+fmt(t.week)+'</td><td class="num">'+fmt(t.month)+'</td></tr>';
        }).join('')+
        '</tbody></table></div></div>';
    }
    var periodHtml =
      periodTable('To NASA — this week / this month', 'Logged NASA payments, by account · week starts Monday', nasaTotals)+
      periodTable('From customers — this week / this month', 'Logged customer payments, by account · week starts Monday', custTotals);

    function agentBadges(p){
      var accts = p.type==='customer' ? (custAccounts[p.customer]||[]) : [p.account];
      accts = accts.filter(Boolean);
      if(!accts.length) return '<span class="muted">—</span>';
      return '<div class="badgebar">'+accts.map(function(a){
        return '<span class="pill" style="background:'+ACCOUNT_COLOR[a]+'22;color:'+ACCOUNT_COLOR[a]+'">'+a+'</span>';
      }).join(' ')+'</div>';
    }

    var rows = all.map(function(p){
      var who = p.type==='customer' ? esc(p.customer) : 'NASA payment';
      var badge = p.type==='customer' ? '<span class="pill accent">Customer</span>' : '<span class="pill">NASA</span>';
      return '<tr><td>'+fmtDate(p.date)+'</td><td>'+badge+'</td><td>'+agentBadges(p)+'</td><td>'+who+'</td><td class="num">'+fmt(p.amount)+'</td><td class="muted">'+esc(p.note||'—')+'</td>'+
        '<td><button class="btn small ghost danger" data-del="'+p.type+':'+p.id+'">Remove</button></td></tr>';
    }).join('');

    root.innerHTML =
      '<div class="grid-cards">'+
        '<div class="card"><div class="card-label">Entries logged</div><div class="card-value">'+(state.customerPayments.length+state.nasaPayments.length)+'</div></div>'+
        '<div class="card"><div class="card-label">From customers</div><div class="card-value">'+fmt(state.customerPayments.reduce(function(a,p){return a+(Number(p.amount)||0);},0))+'</div></div>'+
        '<div class="card"><div class="card-label">To NASA</div><div class="card-value">'+fmt(state.nasaPayments.reduce(function(a,p){return a+(Number(p.amount)||0);},0))+'</div></div>'+
      '</div>'+
      periodHtml+
      snapshotHtml+
      '<div class="section"><div class="section-head"><h2>All payments</h2><span class="hint">'+all.length+' matching'+(searchTerm?' “'+esc(searchTerm)+'”':'')+'</span></div>'+
      '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Agent</th><th>Who</th><th class="num">Amount</th><th>Note</th><th></th></tr></thead>'+
      '<tbody>'+(rows || '<tr><td colspan="7" class="empty">No payments'+(searchTerm?' match “'+esc(searchTerm)+'”':' logged yet. Use “+ Log Payment” to add the first one.')+'.</td></tr>')+'</tbody></table></div></div>';
  }

  function renderView(view){
    if(view==='overview') renderOverview();
    else if(view.indexOf('notfinished-')===0) renderNotFinished(view.slice(12));
    else if(view.indexOf('extworker-')===0) renderExternalWorker(view.slice(10));
    else if(view.indexOf('account-')===0) renderAccount(view.slice(8));
    else if(view==='customers') renderCustomers();
    else if(view==='paymentlog') renderPaymentLog();
  }

  // ---------- delegated events ----------
  document.addEventListener('click', function(e){
    var pageBtn = e.target.closest('[data-page]');
    if(pageBtn){
      var parts = pageBtn.dataset.page.split(':');
      pageState[parts[0]] = parseInt(parts[1],10);
      renderView(currentView);
      return;
    }
    var custFilterBtn = e.target.closest('[data-cust-filter]');
    if(custFilterBtn){
      customerAccountFilter = custFilterBtn.dataset.custFilter;
      renderView(currentView);
      return;
    }
    var extwPeriodBtn = e.target.closest('[data-extw-period]');
    if(extwPeriodBtn){
      extwPeriodFilter = extwPeriodBtn.dataset.extwPeriod;
      renderView(currentView);
      return;
    }
    var openNasa = e.target.closest('[data-open-nasa-pay]');
    if(openNasa){ openPaymentModal('nasa', openNasa.dataset.openNasaPay); return; }
    var openCust = e.target.closest('[data-open-cust-pay]');
    if(openCust){ openPaymentModal('customer', null, openCust.dataset.openCustPay); return; }
    if(e.target.id==='btn-log-payment'){ openPaymentModal('customer'); return; }
    var openExtw = e.target.closest('[data-open-extw-pay]');
    if(openExtw){ openExternalWorkerModal(openExtw.dataset.openExtwPay); return; }
    var delBtn = e.target.closest('[data-del]');
    if(delBtn){
      var dp = delBtn.dataset.del.split(':');
      var type = dp[0], id = dp.slice(1).join(':');
      openConfirmModal('Remove this logged payment? This cannot be undone.', function(){
        if(type==='customer') state.customerPayments = state.customerPayments.filter(function(p){ return p.id!==id; });
        else state.nasaPayments = state.nasaPayments.filter(function(p){ return p.id!==id; });
        renderView(currentView);
        persist('Payment removed.');
      });
      return;
    }
    var delNasa = e.target.closest('[data-del-nasa]');
    if(delNasa){
      var delNasaId = delNasa.dataset.delNasa;
      openConfirmModal('Remove this NASA payment? This cannot be undone.', function(){
        state.nasaPayments = state.nasaPayments.filter(function(p){ return p.id!==delNasaId; });
        renderView(currentView);
        persist('Payment removed.');
      });
      return;
    }
    var delExtw = e.target.closest('[data-del-extw]');
    if(delExtw){
      var delExtwId = delExtw.dataset.delExtw;
      openConfirmModal('Remove this external worker payment? This cannot be undone.', function(){
        state.externalWorkerPayments = state.externalWorkerPayments.filter(function(p){ return p.id!==delExtwId; });
        renderView(currentView);
        persist('Payment removed.');
      });
      return;
    }
  });

  document.addEventListener('change', function(e){
    if(e.target.id==='extw-reason-filter'){
      extwReasonFilter = e.target.value;
      renderView(currentView);
      return;
    }
    if(!e.target.classList.contains('credit-input')) return;
    var val = e.target.value.trim();
    if(e.target.dataset.limit != null){
      var cust = e.target.dataset.limit;
      if(val===''){ delete state.creditLimits[cust]; }
      else { state.creditLimits[cust] = Number(val); }
      renderView(currentView);
      persist('Credit limit updated for '+cust+'.');
    } else if(e.target.dataset.adj != null){
      var cust2 = e.target.dataset.adj;
      if(val===''){ delete state.customerAdjustments[cust2]; }
      else { state.customerAdjustments[cust2] = Number(val); }
      renderView(currentView);
      persist('Opening balance updated for '+cust2+'.');
    } else if(e.target.dataset.acctAdj != null){
      var acct = e.target.dataset.acctAdj;
      state.accountAdjustments[acct] = val==='' ? 0 : Number(val);
      renderView(currentView);
      persist('Opening balance updated for '+acct+'.');
    }
  });

  // ---------- modal ----------
  function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

  // Custom confirm dialog — the artifact preview's sandboxed frame silently blocks the
  // native window.confirm() (it returns false with no dialog shown), which made every
  // "Remove" button look like it did nothing. This renders an in-page confirm instead.
  function openConfirmModal(message, onConfirm){
    var root = document.getElementById('modal-root');
    root.innerHTML =
      '<div class="overlay" id="confirm-overlay">'+
        '<div class="modal">'+
          '<h3>Are you sure?</h3>'+
          '<div class="modal-sub">'+esc(message)+'</div>'+
          '<div class="modal-actions">'+
            '<button type="button" class="btn ghost" id="confirm-cancel">Cancel</button>'+
            '<button type="button" class="btn danger" id="confirm-ok">Remove</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    document.getElementById('confirm-cancel').addEventListener('click', closeModal);
    document.getElementById('confirm-overlay').addEventListener('click', function(e){ if(e.target.id==='confirm-overlay') closeModal(); });
    document.getElementById('confirm-ok').addEventListener('click', function(){ closeModal(); onConfirm(); });
  }

  function openPaymentModal(type, presetAccount, presetCustomer){
    var customers = customerAggregates().map(function(m){ return m.customer; }).sort();
    var root = document.getElementById('modal-root');
    var isCustomer = type==='customer';
    root.innerHTML =
      '<div class="overlay" id="modal-overlay">'+
        '<div class="modal">'+
          '<h3>Log a payment</h3>'+
          '<div class="modal-sub">Record money that moved, so balances stay current for everyone.</div>'+
          '<div class="seg" id="modal-type-seg">'+
            '<button type="button" class="'+(isCustomer?'active':'')+'" data-type="customer">Customer → You</button>'+
            '<button type="button" class="'+(!isCustomer?'active':'')+'" data-type="nasa">You → NASA</button>'+
          '</div>'+
          '<form id="payment-form">'+
            '<div class="field" id="field-customer" style="'+(isCustomer?'':'display:none')+'">'+
              '<label for="pf-customer">Customer</label>'+
              '<input list="customer-list" id="pf-customer" name="customer" placeholder="Type or pick a customer" value="'+esc(presetCustomer||'')+'">'+
              '<datalist id="customer-list">'+customers.map(function(c){ return '<option value="'+esc(c)+'">'; }).join('')+'</datalist>'+
            '</div>'+
            '<div class="field" id="field-account" style="'+(isCustomer?'display:none':'')+'">'+
              '<label for="pf-account">NASA account</label>'+
              '<select id="pf-account" name="account">'+ACCOUNTS.map(function(a){ return '<option value="'+a+'" '+(a===presetAccount?'selected':'')+'>'+a+'</option>'; }).join('')+'</select>'+
            '</div>'+
            '<div class="field"><label for="pf-amount">Amount</label><input type="number" step="0.01" min="0.01" id="pf-amount" name="amount" placeholder="0.00" required></div>'+
            '<div class="field"><label for="pf-date">Date</label><input type="date" id="pf-date" name="date" value="'+todayISO()+'" required></div>'+
            '<div class="field"><label for="pf-note">Note (optional)</label><input type="text" id="pf-note" name="note" placeholder="e.g. bank transfer, cash"></div>'+
            '<div class="modal-actions">'+
              '<button type="button" class="btn ghost" id="modal-cancel">Cancel</button>'+
              '<button type="submit" class="btn primary">Save payment</button>'+
            '</div>'+
          '</form>'+
        '</div>'+
      '</div>';

    var curType = type;
    document.getElementById('modal-type-seg').addEventListener('click', function(e){
      var b = e.target.closest('button[data-type]');
      if(!b) return;
      curType = b.dataset.type;
      document.querySelectorAll('#modal-type-seg button').forEach(function(x){ x.classList.toggle('active', x===b); });
      document.getElementById('field-customer').style.display = curType==='customer' ? '' : 'none';
      document.getElementById('field-account').style.display = curType==='customer' ? 'none' : '';
    });
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').addEventListener('click', function(e){ if(e.target.id==='modal-overlay') closeModal(); });
    document.getElementById('payment-form').addEventListener('submit', function(e){
      e.preventDefault();
      var amount = parseFloat(document.getElementById('pf-amount').value);
      var date = document.getElementById('pf-date').value;
      var note = document.getElementById('pf-note').value.trim();
      if(!amount || amount<=0){ toast('Enter an amount greater than 0.', true); return; }
      if(curType==='customer'){
        var customer = document.getElementById('pf-customer').value.trim();
        if(!customer){ toast('Enter a customer name.', true); return; }
        state.customerPayments.push({ id:uid(), customer:customer, amount:amount, date:date, note:note });
      } else {
        var account = document.getElementById('pf-account').value;
        state.nasaPayments.push({ id:uid(), account:account, amount:amount, date:date, note:note });
      }
      closeModal();
      renderView(currentView);
      persist('Payment logged.');
    });
    setTimeout(function(){ var f = isCustomer? document.getElementById('pf-customer') : document.getElementById('pf-amount'); if(f) f.focus(); },10);
  }

  function openExternalWorkerModal(presetAccount){
    var root = document.getElementById('modal-root');
    root.innerHTML =
      '<div class="overlay" id="extw-overlay">'+
        '<div class="modal">'+
          '<h3>Log external worker payment</h3>'+
          '<div class="modal-sub">For unexpected amounts paid to an external worker, outside the normal NASA cost flow.</div>'+
          '<form id="extw-form">'+
            '<div class="field"><label for="extw-account">Account</label>'+
              '<select id="extw-account" name="account">'+ACCOUNTS.map(function(a){ return '<option value="'+a+'" '+(a===presetAccount?'selected':'')+'>'+a+'</option>'; }).join('')+'</select>'+
            '</div>'+
            '<div class="field"><label for="extw-payee">Paid to</label><input type="text" id="extw-payee" name="payee" placeholder="Name of worker" required></div>'+
            '<div class="field"><label for="extw-amount">Amount</label><input type="number" step="0.01" min="0.01" id="extw-amount" name="amount" placeholder="0.00" required></div>'+
            '<div class="field"><label for="extw-date">Date</label><input type="date" id="extw-date" name="date" value="'+todayISO()+'" required></div>'+
            '<div class="field"><label for="extw-reason">Reason</label><input type="text" id="extw-reason" name="reason" placeholder="e.g. extra unloading labor" required></div>'+
            '<div class="field"><label for="extw-ref">File # or Container #</label><input type="text" id="extw-ref" name="ref" placeholder="e.g. 1138860 or ONEU5892502"></div>'+
            '<div class="field" style="margin-top:-6px;"><div id="extw-match-preview" style="font-size:12.5px; color:var(--ink-dim);"></div></div>'+
            '<div class="modal-actions">'+
              '<button type="button" class="btn ghost" id="extw-cancel">Cancel</button>'+
              '<button type="submit" class="btn primary">Save entry</button>'+
            '</div>'+
          '</form>'+
        '</div>'+
      '</div>';

    function updateMatchPreview(){
      var ref = document.getElementById('extw-ref').value;
      var preview = document.getElementById('extw-match-preview');
      if(!ref.trim()){ preview.textContent = ''; return; }
      var match = findShipmentMatch(ref);
      if(match){
        preview.style.color = 'var(--good)';
        preview.textContent = 'Matched: '+match.customer+' · '+(match.goods||'')+' · file '+(match.fileNumber||'—');
      } else {
        preview.style.color = 'var(--warn)';
        preview.textContent = 'No shipment found with that file/container number — it will still be saved as typed.';
      }
    }
    document.getElementById('extw-ref').addEventListener('input', updateMatchPreview);
    document.getElementById('extw-cancel').addEventListener('click', closeModal);
    document.getElementById('extw-overlay').addEventListener('click', function(e){ if(e.target.id==='extw-overlay') closeModal(); });
    document.getElementById('extw-form').addEventListener('submit', function(e){
      e.preventDefault();
      var amount = parseFloat(document.getElementById('extw-amount').value);
      var date = document.getElementById('extw-date').value;
      var payee = document.getElementById('extw-payee').value.trim();
      var reason = document.getElementById('extw-reason').value.trim();
      var ref = document.getElementById('extw-ref').value.trim();
      var account = document.getElementById('extw-account').value;
      if(!amount || amount<=0){ toast('Enter an amount greater than 0.', true); return; }
      if(!payee){ toast('Enter who was paid.', true); return; }
      if(!reason){ toast('Enter a reason for this payment.', true); return; }
      state.externalWorkerPayments = state.externalWorkerPayments || [];
      state.externalWorkerPayments.push({ id:uid(), account:account, amount:amount, date:date, payee:payee, reason:reason, ref:ref });
      closeModal();
      renderView(currentView);
      persist('External worker payment logged.');
    });
    setTimeout(function(){ var f = document.getElementById('extw-amount'); if(f) f.focus(); },10);
  }

  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  // ---------- init ----------
  var sync = state.meta.lastSync;
  document.getElementById('sidebarfoot').textContent = sync ? ('Shipment data synced '+fmtDate(sync)+' · 2025–2026') : 'Shipment data synced from Drive.';
  switchView('overview');

  // Pull the authoritative cloud copy (shared with octopus-track.com) and
  // refresh once it's in, so edits made on either side are always reflected.
  sbLoadLedger().then(function(cloud){
    if(!cloud){
      // Nothing saved to the cloud yet — seed it with what's embedded here.
      sbSaveLedger(state);
      return;
    }
    state = cloud;
    state.customerPayments = state.customerPayments || [];
    state.nasaPayments = state.nasaPayments || [];
    state.creditLimits = state.creditLimits || {};
    state.customerAdjustments = state.customerAdjustments || {};
    state.accountAdjustments = state.accountAdjustments || { Michy:0, Deia:0, Ayman:0 };
    state.externalWorkerPayments = state.externalWorkerPayments || [];
    state.meta = state.meta || {};
    var syncNow = state.meta.lastSync;
    document.getElementById('sidebarfoot').textContent = syncNow ? ('Shipment data synced '+fmtDate(syncNow)+' · 2025–2026') : 'Shipment data synced from Drive.';
    renderView(currentView);
  });
})();
</script>
</body>
</html>
